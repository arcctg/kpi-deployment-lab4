---
- name: Create application system user
  ansible.builtin.user:
    name: app
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install mywebapp binary
  ansible.builtin.copy:
    src: mywebapp
    dest: "{{ app_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart mywebapp

- name: Ensure application config directory exists
  ansible.builtin.file:
    path: "{{ app_config_dir }}"
    state: directory
    owner: root
    group: app
    mode: "0750"

- name: Deploy application configuration
  ansible.builtin.template:
    src: "{{ deploy_src_dir }}/config.yaml.j2"
    dest: "{{ app_config_path }}"
    owner: root
    group: app
    mode: "0640"
  notify: Restart mywebapp

- name: Deploy systemd socket unit
  ansible.builtin.copy:
    src: "{{ deploy_src_dir }}/mywebapp.socket"
    dest: /etc/systemd/system/mywebapp.socket
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart mywebapp

- name: Deploy systemd service unit
  ansible.builtin.copy:
    src: "{{ deploy_src_dir }}/mywebapp.service"
    dest: /etc/systemd/system/mywebapp.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart mywebapp

- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start mywebapp socket
  ansible.builtin.systemd:
    name: mywebapp.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start mywebapp service
  ansible.builtin.systemd:
    name: mywebapp.service
    enabled: true
    state: started
    daemon_reload: true
