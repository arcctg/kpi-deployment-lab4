---
- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - postgresql
      - ufw
      - python3-psycopg2
    state: present
    update_cache: true

- name: Configure PostgreSQL listen address
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ ansible_host }}'"
  notify: Restart postgresql

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgresql

- name: Ensure PostgreSQL service is enabled and running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create application database role
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: LOGIN
    login_unix_socket: /var/run/postgresql

- name: Create application database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    login_unix_socket: /var/run/postgresql

- name: Allow PostgreSQL from worker VM
  community.general.ufw:
    rule: allow
    port: "{{ db_port }}"
    proto: tcp
    from_ip: "{{ worker_ip }}"

- name: Allow PostgreSQL from local VM
  community.general.ufw:
    rule: allow
    port: "{{ db_port }}"
    proto: tcp
    from_ip: "{{ ansible_host }}"

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
